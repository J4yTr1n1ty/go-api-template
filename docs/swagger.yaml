basePath: /
definitions:
  dtos.CreateExampleRequest:
    properties:
      name:
        maxLength: 255
        minLength: 1
        type: string
    required:
    - name
    type: object
  dtos.ExampleListResponse:
    properties:
      data:
        items:
          $ref: '#/definitions/dtos.ExampleResponse'
        type: array
      metadata:
        $ref: '#/definitions/dtos.PaginationMeta'
    type: object
  dtos.ExampleResponse:
    properties:
      id:
        type: integer
      name:
        type: string
    type: object
  dtos.PaginationMeta:
    properties:
      has_more:
        type: boolean
      skip:
        type: integer
      take:
        type: integer
      total:
        type: integer
    type: object
host: localhost:8080
info:
  contact: {}
  description: A template for building Go REST APIs.
  title: Go API Template
  version: dev
paths:
  /example:
    get:
      parameters:
      - default: 0
        description: Number of records to skip
        in: query
        name: skip
        type: integer
      - default: 20
        description: Number of records to return
        in: query
        maximum: 100
        name: take
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dtos.ExampleListResponse'
        "400":
          description: invalid pagination params
          schema:
            type: object
        "500":
          description: internal server error
          schema:
            type: object
      summary: List examples
      tags:
      - Example
    post:
      consumes:
      - application/json
      parameters:
      - description: Example data
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dtos.CreateExampleRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/dtos.ExampleResponse'
        "400":
          description: invalid request body
          schema:
            type: object
        "409":
          description: already exists
          schema:
            type: object
        "422":
          description: validation error
          schema:
            type: object
        "500":
          description: internal server error
          schema:
            type: object
      summary: Create example
      tags:
      - Example
securityDefinitions:
  bearerAuth:
    description: Type "Bearer" followed by a space and a JWT token.
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
